<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub 图床</title>
  <!-- 引入 Tailwind CSS 样式库 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
    <!-- 头部栏 -->
    <div class="flex justify-between items-center mb-6 border-b pb-4">
      <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">📷 GitHub 极简图床</h1>
      <button id="toggleConfig" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 py-1.5 px-3 rounded-lg border transition">
        ⚙️ 设置配置
      </button>
    </div>

    <!-- 配置面板 -->
    <div id="configPanel" class="bg-gray-50 p-4 rounded-lg border mb-6 hidden">
      <h2 class="text-sm font-semibold text-gray-700 mb-3">GitHub 配置（配置仅保存于本地浏览器）</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-gray-600 mb-1">Personal Access Token (PAT) <span class="text-red-500">*</span></label>
          <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" class="w-full p-2 text-sm border rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">GitHub 用户名 (Owner) <span class="text-red-500">*</span></label>
          <input type="text" id="ghOwner" placeholder="your-username" class="w-full p-2 text-sm border rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">仓库名 (Repo) <span class="text-red-500">*</span></label>
          <input type="text" id="ghRepo" placeholder="image-repo" class="w-full p-2 text-sm border rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">分支 (Branch)</label>
          <input type="text" id="ghBranch" value="main" class="w-full p-2 text-sm border rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">存储目录 (例如: images/)</label>
          <input type="text" id="ghPath" placeholder="images/" class="w-full p-2 text-sm border rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">默认 CDN 加速域名</label>
          <select id="cdnType" class="w-full p-2 text-sm border rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
            <option value="jsdelivr">jsDelivr CDN (推荐)</option>
            <option value="raw">Raw GitHub (原生)</option>
            <option value="statically">Statically CDN</option>
          </select>
        </div>
      </div>
      <button id="saveConfig" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded text-sm font-semibold transition">
        保存配置
      </button>
    </div>

    <!-- 上传区域 -->
    <div id="dropZone" class="border-2 border-dashed border-blue-300 rounded-xl p-8 text-center hover:border-blue-500 transition-colors cursor-pointer bg-blue-50/30 mb-6">
      <svg class="mx-auto h-12 w-12 text-blue-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
      </svg>
      <p class="text-gray-700 font-medium mb-1">点击选择图片 或 将图片拖拽至此处</p>
      <p class="text-xs text-gray-400">支持截图后直接快捷键 <kbd class="px-1.5 py-0.5 bg-gray-200 rounded text-gray-700">Ctrl+V</kbd> 粘贴</p>
      <input type="file" id="fileInput" accept="image/*" class="hidden">
    </div>

    <!-- 上传状态提示 -->
    <div id="status" class="hidden text-center p-3 mb-6 text-sm rounded-lg"></div>

    <!-- 上传结果展示区 -->
    <div id="resultPanel" class="hidden border-t pt-6">
      <h3 class="font-semibold text-gray-700 mb-4 flex items-center gap-1">✅ 上传成功</h3>
      <div class="flex flex-col md:flex-row gap-6 items-start">
        <img id="previewImg" src="" class="w-full md:w-48 h-48 rounded-lg border object-cover bg-gray-50">
        <div class="flex-1 w-full space-y-3">
          <div>
            <label class="text-xs font-semibold text-gray-500 block mb-1">图片 URL 直链</label>
            <div class="flex">
              <input type="text" id="urlDirect" readonly class="w-full p-2 text-xs bg-gray-50 border rounded-l focus:outline-none">
              <button onclick="copyText('urlDirect')" class="bg-gray-100 hover:bg-gray-200 px-3 text-xs border border-l-0 rounded-r font-medium text-gray-600">复制</button>
            </div>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500 block mb-1">Markdown 格式</label>
            <div class="flex">
              <input type="text" id="urlMarkdown" readonly class="w-full p-2 text-xs bg-gray-50 border rounded-l focus:outline-none">
              <button onclick="copyText('urlMarkdown')" class="bg-gray-100 hover:bg-gray-200 px-3 text-xs border border-l-0 rounded-r font-medium text-gray-600">复制</button>
            </div>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500 block mb-1">HTML 格式</label>
            <div class="flex">
              <input type="text" id="urlHTML" readonly class="w-full p-2 text-xs bg-gray-50 border rounded-l focus:outline-none">
              <button onclick="copyText('urlHTML')" class="bg-gray-100 hover:bg-gray-200 px-3 text-xs border border-l-0 rounded-r font-medium text-gray-600">复制</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // DOM 元素引用
    const toggleConfigBtn = document.getElementById('toggleConfig');
    const configPanel = document.getElementById('configPanel');
    const saveConfigBtn = document.getElementById('saveConfig');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const statusDiv = document.getElementById('status');
    const resultPanel = document.getElementById('resultPanel');

    // 加载配置
    function loadConfig() {
      document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
      document.getElementById('ghOwner').value = localStorage.getItem('gh_owner') || '';
      document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
      document.getElementById('ghBranch').value = localStorage.getItem('gh_branch') || 'main';
      document.getElementById('ghPath').value = localStorage.getItem('gh_path') || 'images/';
      document.getElementById('cdnType').value = localStorage.getItem('gh_cdn') || 'jsdelivr';

      if (!localStorage.getItem('gh_token')) {
        configPanel.classList.remove('hidden');
      }
    }

    // 保存配置
    saveConfigBtn.addEventListener('click', () => {
      localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
      localStorage.setItem('gh_owner', document.getElementById('ghOwner').value.trim());
      localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('gh_branch', document.getElementById('ghBranch').value.trim() || 'main');
      
      let path = document.getElementById('ghPath').value.trim();
      if (path && !path.endsWith('/')) path += '/';
      if (path.startsWith('/')) path = path.slice(1);
      localStorage.setItem('gh_path', path);

      localStorage.setItem('gh_cdn', document.getElementById('cdnType').value);

      showStatus('配置保存成功！', 'bg-green-100 text-green-700');
      configPanel.classList.add('hidden');
    });

    toggleConfigBtn.addEventListener('click', () => {
      configPanel.classList.toggle('hidden');
    });

    // 拖拽与上传事件响应
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-blue-500'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-blue-500'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-blue-500');
      handleFiles(e.dataTransfer.files);
    });

    // 支持剪贴板直接粘贴 (Ctrl+V)
    document.addEventListener('paste', (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (items) {
        for (let item of items) {
          if (item.type.indexOf('image') !== -1) {
            const file = item.getAsFile();
            handleFiles([file]);
            break;
          }
        }
      }
    });

    function handleFiles(files) {
      if (files.length === 0) return;
      const file = files[0];
      if (!file.type.startsWith('image/')) {
        showStatus('请上传有效的图片文件！', 'bg-red-100 text-red-700');
        return;
      }
      uploadImage(file);
    }

    // 核心逻辑：使用 GitHub REST API 上传图片
    async function uploadImage(file) {
      const token = localStorage.getItem('gh_token');
      const owner = localStorage.getItem('gh_owner');
      const repo = localStorage.getItem('gh_repo');
      const branch = localStorage.getItem('gh_branch') || 'main';
      const dirPath = localStorage.getItem('gh_path') || '';

      if (!token || !owner || !repo) {
        showStatus('请先点击右上角【设置配置】填写 GitHub 信息！', 'bg-yellow-100 text-yellow-800');
        configPanel.classList.remove('hidden');
        return;
      }

      showStatus('正在上传图片中，请稍候...', 'bg-blue-100 text-blue-700');
      resultPanel.classList.add('hidden');

      try {
        // 读取图片文件转 Base64
        const base64Content = await fileToBase64(file);
        
        // 生成唯一文件名 (当前时间戳 + 随机数 + 后缀)
        const ext = file.name.split('.').pop() || 'png';
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${ext}`;
        const fullPath = `${dirPath}${fileName}`;

        // 请求 GitHub API 上传文件
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${fullPath}`;
        const response = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify({
            message: `Upload image ${fileName} via Web UI`,
            content: base64Content.split(',')[1], // 截去 Base64 前缀
            branch: branch
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.message || '上传失败');
        }

        // 生成访问链接
        const cdnType = localStorage.getItem('gh_cdn') || 'jsdelivr';
        let imgUrl = '';
        if (cdnType === 'jsdelivr') {
          imgUrl = `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${branch}/${fullPath}`;
        } else if (cdnType === 'statically') {
          imgUrl = `https://cdn.statically.io/gh/${owner}/${repo}/${branch}/${fullPath}`;
        } else {
          imgUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${fullPath}`;
        }

        // 渲染页面
        document.getElementById('previewImg').src = imgUrl;
        document.getElementById('urlDirect').value = imgUrl;
        document.getElementById('urlMarkdown').value = `![${fileName}](${imgUrl})`;
        document.getElementById('urlHTML').value = `<img src="${imgUrl}" alt="${fileName}" />`;

        showStatus('上传成功！', 'bg-green-100 text-green-700');
        resultPanel.classList.remove('hidden');

      } catch (err) {
        showStatus(`上传失败: ${err.message}`, 'bg-red-100 text-red-700');
      }
    }

    // 辅助工具：File 转 Base64
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    // 辅助工具：复制文本到剪贴板
    function copyText(inputId) {
      const input = document.getElementById(inputId);
      input.select();
      document.execCommand('copy');
      alert('已成功复制到剪贴板！');
    }

    function showStatus(text, bgClass) {
      statusDiv.className = `p-3 mb-6 text-sm rounded-lg ${bgClass}`;
      statusDiv.innerText = text;
      statusDiv.classList.remove('hidden');
    }

    // 初始化加载
    loadConfig();
  </script>
</body>
</html>
